<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">ShardZero three-node Raft cluster</title><desc id="desc">A client connects through a leader to three replicated Raft nodes with persistent logs.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="480" fill="url(#g)" rx="24"/><text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">ShardZero · Replicated Raft cluster</text><text x="60" y="105" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">One ordered log · quorum commits · automatic failover</text>
  <rect x="55" y="190" width="180" height="100" rx="14" fill="#0ea5e9"/><text x="145" y="232" text-anchor="middle" fill="white" font-family="Arial" font-size="23" font-weight="700">Client</text><text x="145" y="262" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="15">SET · GET · CAS</text>
  <path d="M245 240 H390" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/><text x="316" y="222" text-anchor="middle" fill="#7dd3fc" font-family="Arial" font-size="14">leader route</text>
  <g font-family="Arial"><rect x="405" y="150" width="215" height="155" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="512" y="191" text-anchor="middle" fill="#bbf7d0" font-size="23" font-weight="700">Node 1</text><text x="512" y="220" text-anchor="middle" fill="#86efac" font-size="16">Leader</text><text x="512" y="265" text-anchor="middle" fill="#dcfce7" font-size="15">Raft WAL + snapshot</text>
  <rect x="755" y="75" width="215" height="155" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="862" y="116" text-anchor="middle" fill="#bfdbfe" font-size="23" font-weight="700">Node 2</text><text x="862" y="145" text-anchor="middle" fill="#93c5fd" font-size="16">Follower</text><text x="862" y="190" text-anchor="middle" fill="#dbeafe" font-size="15">Raft WAL + snapshot</text>
  <rect x="755" y="285" width="215" height="155" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="862" y="326" text-anchor="middle" fill="#bfdbfe" font-size="23" font-weight="700">Node 3</text><text x="862" y="355" text-anchor="middle" fill="#93c5fd" font-size="16">Follower</text><text x="862" y="400" text-anchor="middle" fill="#dbeafe" font-size="15">Raft WAL + snapshot</text></g>
  <path d="M620 190 L748 145 M620 265 L748 360 M862 232 V282" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="985" y="245" fill="#7dd3fc" font-family="Arial" font-size="16">Raft RPCs</text>
</svg>
